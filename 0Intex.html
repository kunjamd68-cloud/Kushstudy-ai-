<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KushStudy AI</title>

  <link rel="stylesheet" href="style.css">
  <style>
    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f172a;
  color:white;
  font-family:Arial;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 8%;
  background:#111827;
}

nav{
  display:flex;
  gap:20px;
}

nav a{
  color:white;
  text-decoration:none;
}

.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:60px;
  padding:40px;
  flex-wrap:wrap;
}

.left h2{
  font-size:60px;
  margin-bottom:20px;
}

.left p{
  color:#cbd5e1;
  margin-bottom:20px;
}

button{
  padding:14px 28px;
  border:none;
  border-radius:10px;
  background:#38bdf8;
  color:white;
}

.card{
  background:#1e293b;
  padding:40px;
  border-radius:20px;
}
  </style>
</head>

<body>

  <header>
    <h1>KushStudy AI</h1>

    <nav>
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">Dashboard</a>
    </nav>
  </header>

  <section class="hero">

    <div class="left">

      <h2>
        AI Powered Study Platform
      </h2>

      <p>
        Study smarter with modern productivity tools.
      </p>

      <button>
        Start Free
      </button>

    </div>

    <div class="right">

      <div class="card">
        <h3>Today's Study</h3>
        <p>6.5 Hours</p>
      </div>

    </div>

  </section>

  <script>
    alert("KushStudy AI Loaded Successfully");
  </script>

</body>
</html>
